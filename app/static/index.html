<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOAST · TEECMO</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="shell">
<aside class="sidebar" id="sidebar" hidden><div class="brand"><span class="logo">S</span><span>SOAST<small>TEECMO · SOPORTE</small></span></div>
<nav id="nav"></nav><div class="sidebar-foot"><div id="account"></div><button id="logout" class="quiet">Cerrar sesión</button></div></aside>
<main class="content"><header><div><small class="eyebrow">PLATAFORMA DE ORQUESTACIÓN</small><h1 id="heading">Acceso a SOAST</h1></div><div id="clock"></div></header>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<section id="login" class="login-card"><h2>Bienvenido</h2><p>Ingresa con las credenciales asignadas por TEECMO.</p><form id="login-form"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" required type="password" autocomplete="current-password"></label><button class="primary">Iniciar sesión</button></form><p class="hint">En la primera instalación, configura las variables de administrador y ejecuta la inicialización.</p></section>
<section id="view" hidden></section>
</main></div><script src="/static/app.js" defer></script></body></html>
